name: Release

# Pushing or merging to cli-channel/<channel> publishes a build on that channel.
# See docs/RELEASE_ARCHITECTURE.md.
on:
  push:
    branches: ["cli-channel/**"]

permissions:
  contents: read

# One publish per channel at a time. GitHub keeps only the newest pending run
# per group, which is the commit that should publish anyway.
concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    # build.ts re-signs the darwin binaries with codesign, which only exists on macOS.
    runs-on: macos-latest
    timeout-minutes: 15
    # Publishing auto-updates every CLI on the channel. cli-release requires a
    # reviewer; cli-prerelease (every other channel) doesn't.
    environment: ${{ github.ref_name == 'cli-channel/release' && 'cli-release' || 'cli-prerelease' }}
    permissions:
      contents: write
    steps:
      # All tags, for next-version and release notes. Keep the write token out of
      # .git/config; later steps run repo and dependency code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Resolve version
        run: |
          channel="${GITHUB_REF_NAME#cli-channel/}"
          version="$(bun run --silent next-version "$channel")"
          echo "TAG=cli-v$version" >> "$GITHUB_ENV"
      - run: bun run release "$TAG" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run publish "$TAG" dist
