name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Two runs could both pass the "tag is new" check and race to publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    # build.ts re-signs the darwin binaries with codesign, which only exists on macOS.
    runs-on: macos-latest
    timeout-minutes: 10
    # Publishing a release auto-updates every installed dh instance. Configure this
    # environment in repo settings to gate the job (required reviewers, allowed branches/tags).
    environment: release
    permissions:
      contents: write
    steps:
      # Keep the write token out of .git/config; later steps run repo and dependency code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Resolve tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$(jq -r .version package.json)"
            # --exit-code: 0 = found, 2 = not found, anything else = couldn't check.
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::$tag already exists; bump version in package.json"
              exit 1
            elif [ "$rc" -ne 2 ]; then
              echo "::error::could not check whether $tag exists"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run release "$TAG" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Tags with a suffix (v3.0.1-rc.1) are prereleases, which releases/latest ignores.
        run: |
          flags="--generate-notes"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          # Manual runs create the tag; tags made with GITHUB_TOKEN don't retrigger this workflow.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            flags="$flags --target $GITHUB_SHA"
          else
            flags="$flags --verify-tag"
          fi
          gh release create "$TAG" dist/* $flags
